<script>
// ====== 状態 ====================================================
// 各タスク: { code, state, assignee }
//   state: completed | in_progress | overdue | not_started
//   assignee: 担当者名 / null（null = 未割当 → 黄背景 "?"）
const STAFF = ['田中','佐藤','鈴木','伊藤','高橋'];

// ====== モックデータ ============================================
function mkT(code, state, assignee) {
  return { code, state, assignee };
}

const matters = [

      mkT(7,'not_started','田中'), mkT(8,'not_started','田中'), mkT(9,'not_started','田中'),

      mkT(13,'not_started','鈴木'), mkT(14,'not_started','田中'), mkT(15,'not_started','田中'),

      mkT(4,'completed','伊藤'), mkT(5,'completed','伊藤'), mkT(6,'completed','高橋'),
      mkT(7,'completed','伊藤'), mkT(8,'completed','伊藤'), mkT(9,'completed','伊藤'),
      mkT(10,'completed','伊藤'), mkT(11,'completed','伊藤'), mkT(12,'completed','伊藤'),
      mkT(13,'completed','高橋'), mkT(14,'completed','伊藤'), mkT(15,'in_progress','伊藤'),
      mkT(16,'not_started','伊藤'),
    ]},

  { num:'2026010103', broker:'カチタス株式会社', parties:'カチタス → 鈴木次郎', settle:'11/06(木) 10:00',
    main:'佐藤', next:{name:'2回目書類受領（売主）', date:'2026-10-30', days:2},
    tasks:[
      mkT(1,'completed','佐藤'), mkT(2,'completed','佐藤'), mkT(3,'completed','佐藤'),
      mkT(4,'completed','佐藤'), mkT(5,'overdue','佐藤'), mkT(7,'not_started','佐藤'),
      mkT(8,'not_started',null), mkT(9,'not_started','佐藤'), mkT(10,'not_started','佐藤'),
      mkT(11,'not_started',null), mkT(12,'not_started','佐藤'), mkT(14,'not_started','佐藤'),
      mkT(15,'not_started','佐藤'), mkT(16,'not_started','佐藤'),
    ]},

  { num:'2026010104', broker:'みずほ信託', parties:'高橋三郎 → 法人B', settle:'11/07(金) 13:30',
    main:'鈴木', next:{name:'初回書類受領', date:'2026-10-26', days:-2},
    tasks:[
      mkT(1,'completed','鈴木'), mkT(2,'completed','鈴木'), mkT(3,'overdue','鈴木'),
      mkT(4,'not_started','鈴木'), mkT(6,'not_started',null), mkT(7,'not_started','鈴木'),
      mkT(8,'not_started','鈴木'), mkT(9,'not_started',null), mkT(10,'not_started','鈴木'),
      mkT(11,'not_started','鈴木'), mkT(12,'not_started','鈴木'), mkT(13,'not_started',null),
      mkT(14,'not_started','鈴木'), mkT(15,'not_started','鈴木'), mkT(16,'not_started','鈴木'),
    ]},

  { num:'2026010105', broker:'積水ハウス', parties:'積水ハウス → 個人C', settle:'11/08(土) 09:00',
    main:'伊藤', next:{name:'前日連絡', date:'2026-11-07', days:10},
    tasks:[
      mkT(1,'completed','伊藤'), mkT(2,'completed','伊藤'), mkT(3,'completed','伊藤'),
      mkT(4,'completed','伊藤'), mkT(5,'completed','伊藤'), mkT(6,'completed','高橋'),
      mkT(7,'completed','伊藤'), mkT(8,'completed','伊藤'), mkT(9,'in_progress','伊藤'),
      mkT(10,'not_started','伊藤'), mkT(11,'not_started','伊藤'), mkT(12,'not_started','伊藤'),
      mkT(13,'not_started','高橋'), mkT(14,'not_started','伊藤'), mkT(15,'not_started','伊藤'),

  { num:'2026010106', broker:'フラックス', parties:'個人D → フラックス', settle:'11/10(月) 11:00',

    tasks:[
      mkT(1,'not_started','田中'), mkT(2,'not_started','田中'), mkT(3,'not_started',null),
      mkT(4,'not_started',null), mkT(5,'not_started',null), mkT(6,'not_started',null),
      mkT(7,'not_started','田中'), mkT(8,'not_started','田中'), mkT(9,'not_started','田中'),
      mkT(10,'not_started','田中'), mkT(11,'not_started','田中'), mkT(12,'not_started','田中'),
      mkT(13,'not_started',null), mkT(14,'not_started','田中'), mkT(15,'not_started','田中'),
      mkT(16,'not_started','田中'),
    ]},

  { num:'2026010107', broker:null, parties:'個人E → 個人F', settle:'11/12(水) 15:00',
    main:'佐藤', next:{name:'必要書類一覧送付', date:'2026-10-30', days:2},
    tasks:[
      mkT(1,'completed','佐藤'), mkT(2,'completed','佐藤'), mkT(3,'completed','佐藤'),
      mkT(4,'in_progress','佐藤'), mkT(5,'not_started','佐藤'), mkT(7,'not_started','佐藤'),
      mkT(8,'not_started','佐藤'), mkT(9,'not_started','佐藤'), mkT(10,'not_started','佐藤'),
      mkT(11,'not_started','佐藤'), mkT(12,'not_started','佐藤'), mkT(14,'not_started','佐藤'),
      mkT(15,'not_started','佐藤'), mkT(16,'not_started','佐藤'),
    ]},

  { num:'2026010108', broker:'三菱UFJ銀行', parties:'個人G → 個人H', settle:'11/15(土) 09:30',
    main:'鈴木', next:{name:'決済・登記申請', date:'2026-11-15', days:18},
    tasks:[
      mkT(1,'completed','鈴木'), mkT(2,'completed','鈴木'), mkT(3,'completed','鈴木'),
      mkT(4,'completed','鈴木'), mkT(5,'completed','鈴木'), mkT(7,'completed','鈴木'),
      mkT(8,'in_progress','鈴木'), mkT(9,'in_progress','鈴木'), mkT(10,'in_progress','鈴木'),
      mkT(11,'not_started','鈴木'), mkT(12,'not_started','鈴木'), mkT(14,'not_started','鈴木'),
      mkT(15,'not_started','鈴木'), mkT(16,'not_started','鈴木'),
    ]},
];

// ====== 描画 ====================================================
function dueClass(d){ if(d===null||d===undefined) return 'text-gray-500';
  if(d<0) return 'font-bold text-red-600'; if(d<=2) return 'text-red-600';
  if(d<=5) return 'text-amber-600'; return 'text-gray-500'; }
function dueLabel(d){ if(d===null||d===undefined) return '';
  if(d<0) return ` ${Math.abs(d)}日超過`; if(d===0) return ' 本日'; return ` あと${d}日`; }

function cellClass(t) {
  if (t.state === 'completed')   return 'bg-emerald-500 text-white';
  if (t.state === 'overdue')     return 'bg-red-500 ring-1 ring-red-700 text-white';
  if (t.state === 'in_progress') return 'bg-blue-500 text-white';
  if (!t.assignee)               return 'bg-amber-100 ring-1 ring-amber-400 text-amber-800';
  return 'bg-white ring-1 ring-gray-300 text-gray-400';
}

function renderGrid(tasks) {
  return `<div class="inline-flex flex-wrap gap-0.5">` +
    tasks.map((t) => {
      const initial = !t.assignee ? '?' : t.assignee[0];
      const tooltip = `#${t.code}\n担当: ${t.assignee ?? '未割当'}\n状態: ${t.state}`;
      return `<a href="matter.html" title="${tooltip}"
        class="flex items-center justify-center rounded text-[10px] font-bold leading-none ${cellClass(t)}"
        style="width:22px;height:22px;">${initial}</a>`;
    }).join('') +
  `</div>`;
}

function counters(tasks) {
  const incomplete = tasks.filter((t) => t.state !== 'completed');
  return {
    total:       tasks.length,
    completed:   tasks.filter((t) => t.state === 'completed').length,
    in_progress: tasks.filter((t) => t.state === 'in_progress').length,
    overdue:     incomplete.filter((t) => t.state === 'overdue').length,
    unassigned:  incomplete.filter((t) => !t.assignee).length,
  };
}

function badge(tone, symbol, value, title) {
  const tones = {
    red:'bg-red-100 text-red-800 ring-red-300',
    amber:'bg-amber-100 text-amber-800 ring-amber-300',
    blue:'bg-blue-100 text-blue-800 ring-blue-300',
    emerald:'bg-emerald-100 text-emerald-800 ring-emerald-300',
  };
  return `<span title="${title}" class="inline-flex items-center gap-0.5 rounded px-1.5 py-0.5 ring-1 ${tones[tone]}">
    <span aria-hidden>${symbol}</span><span class="font-semibold">${value}</span>
  </span>`;
}

function renderCounters(c) {
  const parts = [];
  if (c.overdue > 0)     parts.push(badge('red',     '⚠', c.overdue,    '期日超過'));
  if (c.unassigned > 0)  parts.push(badge('amber',   '?', c.unassigned, '未割当'));
  if (c.in_progress > 0) parts.push(badge('blue',    '◐', c.in_progress,'進行中'));
  parts.push(badge('emerald', '✓', c.completed, '完了'));
  parts.push(`<span class="text-gray-400">/${c.total}</span>`);
  return `<div class="flex items-center gap-1.5 text-xs tabular-nums">${parts.join('')}</div>`;
}

function renderRow(m) {
  const c = counters(m.tasks);
  const staffOptions = STAFF.map((s) => `<option ${s===m.main?'selected':''}>${s}</option>`).join('');

  return `<tr class="border-b align-middle hover:bg-gray-50">
    <td class="px-2 py-2 font-mono"><a href="matter.html" class="text-brand-blue hover:underline">${m.num}</a></td>
    <td class="max-w-[160px] truncate px-2 py-2 text-gray-700">${m.broker ?? '<span class="text-gray-300">—</span>'}</td>
    <td class="max-w-[180px] truncate px-2 py-2 text-gray-700">${m.parties}</td>
    <td class="px-2 py-2 text-gray-700">${m.settle}</td>
    <td class="px-2 py-2">${renderCounters(c)}</td>
    <td class="px-2 py-2">${renderGrid(m.tasks)}</td>
    <td class="max-w-[260px] truncate px-2 py-2">
      <span class="text-gray-700">${m.next.name}</span>
      <span class="ml-2 text-xs ${dueClass(m.next.days)}">${m.next.date}${dueLabel(m.next.days)}</span>
    </td>
    <td class="px-2 py-2">
      <select class="w-28 rounded border-gray-200 bg-transparent text-sm focus:ring-1 focus:ring-brand-blue">
        ${staffOptions}
      </select>
    </td>
  </tr>`;
}

document.getElementById('rows').innerHTML = matters.map(renderRow).join('');
</script>
